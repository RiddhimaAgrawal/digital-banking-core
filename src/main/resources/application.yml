server:
  port: 8080

spring:
  application:
    name: digital-banking-core

  datasource:
    # Host port 5433 is used by docker-compose so it does not clash with a PostgreSQL you may already have on 5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # The JWT signature keys are discovered lazily from Keycloak on the first authenticated request.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: bank-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

bank:
  currency: NPR
  fraud:
    max-transfer-amount: 500000.00     # a single transfer above this is blocked
    daily-limit: 1000000.00            # total outgoing transfers per account per UTC day
    velocity-max-transfers: 5          # more than this many transfers ...
    velocity-window-seconds: 60        # ... within this window is blocked
  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100
  statements:
    cron: "0 0 1 1 * *"                # 01:00 UTC on the 1st of every month

logging:
  level:
    com.bankcore: INFO
    org.apache.kafka: WARN
